<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FAST ORB - Global Leaderboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0c10;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            position: relative;
        }
        #game-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }
        canvas {
            background-color: #07090e;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.3);
            display: block;
        }
        .top-btn {
            position: absolute;
            top: 15px;
            width: 42px;
            height: 42px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #66fcf1;
            border-radius: 50%;
            color: #66fcf1;
            font-size: 16px;
            font-weight: bold;
            display: none;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 10;
            outline: none;
        }
        #pauseBtn { right: 15px; }
        #soundBtn { right: 67px; font-size: 14px; }
        #leaderboardBtn { right: 119px; font-size: 14px; }

        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(7, 9, 14, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            color: #fff;
        }
        .modal-content {
            background: #1f2833;
            border: 2px solid #66fcf1;
            padding: 20px;
            border-radius: 10px;
            width: 85%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 0 15px rgba(102, 252, 241, 0.4);
        }
        .modal-title {
            font-size: 20px;
            color: #66fcf1;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .leaderboard-list {
            list-style: none;
            padding: 0;
            margin: 10px 0;
            max-height: 180px;
            overflow-y: auto;
            text-align: left;
            font-size: 14px;
        }
        .leaderboard-list li {
            padding: 6px 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
        }
        .leaderboard-list li span.rank {
            color: #f3e600;
            font-weight: bold;
            margin-right: 8px;
        }
        .close-btn, .submit-btn {
            margin-top: 15px;
            padding: 8px 16px;
            background: #66fcf1;
            color: #0b0c10;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            margin-top: 10px;
            border-radius: 4px;
            border: 1px solid #66fcf1;
            background: #0b0c10;
            color: #fff;
            text-align: center;
            font-size: 16px;
        }
    </style>

    <!-- Tích hợp SDK Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <button id="leaderboardBtn" class="top-btn">🏆</button>
    <button id="soundBtn" class="top-btn">🔊</button>
    <button id="pauseBtn" class="top-btn">❚❚</button>
</div>

<!-- Modal Bảng Xếp Hạng Toàn Cầu -->
<div id="leaderboardModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-title">🏆 GLOBAL TOP 10</div>
        <ul id="leaderboardList" class="leaderboard-list">
            <li>Đang tải dữ liệu online...</li>
        </ul>
        <button id="closeLeaderboardBtn" class="close-btn">Đóng</button>
    </div>
</div>

<!-- Modal Nhập Tên -->
<div id="nameInputModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-title">🎉 KỶ LỤC MỚI!</div>
        <p style="font-size: 14px; color: #a0a5b0;">Nhập tên để đưa lên Bảng Xếp Hạng Online:</p>
        <input type="text" id="playerNameInput" maxlength="12" placeholder="Gold Hunter" />
        <button id="submitScoreBtn" class="submit-btn">LƯU ĐIỂM ONLINE</button>
    </div>
</div>

<script>
// --- CẤU HÌNH FIREBASE REALTIME DATABASE ---
const firebaseConfig = {
  apiKey: "AIzaSyDOBRKvzIpxRqgjBnTaitaNoyMneTKL1vI",
  authDomain: "fast-orb-game.firebaseapp.com",
  databaseURL: "https://fast-orb-game-default-rtdb.firebaseio.com",
  projectId: "fast-orb-game",
  storageBucket: "fast-orb-game.firebasestorage.app",
  messagingSenderId: "511846230655",
  appId: "1:511846230655:web:2641dd09edca1872a52d4a",
  measurementId: "G-18MZJKRT70"
};

// Khởi tạo Firebase
let db = null;
try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
} catch(e) {
    console.log("Lỗi khởi tạo Firebase");
}

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const pauseBtn = document.getElementById('pauseBtn');
const soundBtn = document.getElementById('soundBtn');
const leaderboardBtn = document.getElementById('leaderboardBtn');
const leaderboardModal = document.getElementById('leaderboardModal');
const closeLeaderboardBtn = document.getElementById('closeLeaderboardBtn');
const nameInputModal = document.getElementById('nameInputModal');
const playerNameInput = document.getElementById('playerNameInput');
const submitScoreBtn = document.getElementById('submitScoreBtn');
const leaderboardList = document.getElementById('leaderboardList');

function resizeCanvas() {
    let w = window.innerWidth;
    let h = window.innerHeight;
    
    if (!w || !h || w < 100 || h < 100) {
        w = document.documentElement.clientWidth || 360;
        h = document.documentElement.clientHeight || 640;
    }

    const size = Math.max(200, Math.floor(Math.min(w, h) * 0.92));
    canvas.width = size;
    canvas.height = size;

    if (orb) {
        orb.radius = canvas.width * 0.25;
    }
}

let audioCtx = null;
let soundEnabled = true;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

function playSound(freq, type, duration) {
    if (!soundEnabled) return;
    try {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
}

let gameState = 'START'; 
let score = 0;
let level = 1;
let highScore = 0;
let lives = 1;        
let maxLives = 5;     
let hasShield = false; 
let doubleScoreActive = false;
let doubleScoreTimer = 0;

let shakeDuration = 0;
let shakeMagnitude = 0;

// Đọc dữ liệu Leaderboard từ Firebase theo thời gian thực (Realtime)
function listenGlobalLeaderboard() {
    if (!db) {
        leaderboardList.innerHTML = '<li>Lỗi kết nối database</li>';
        return;
    }
    db.ref('leaderboard').orderByChild('score').limitToLast(10).on('value', (snapshot) => {
        let scores = [];
        snapshot.forEach((child) => {
            scores.push(child.val());
        });
        scores.reverse(); // Sắp xếp từ cao xuống thấp
        
        leaderboardList.innerHTML = '';
        if (scores.length === 0) {
            leaderboardList.innerHTML = '<li>Chưa có kỷ lục nào</li>';
            return;
        }
        scores.forEach((entry, index) => {
            let li = document.createElement('li');
            li.innerHTML = `<span><span class="rank">#${index + 1}</span> ${entry.name}</span><span>${entry.score} pts</span>`;
            leaderboardList.appendChild(li);
        });
    });
}

// Gửi điểm lên Firebase Cloud
function pushScoreToFirebase(name, score) {
    if (!db) return;
    db.ref('leaderboard').push({
        name: name,
        score: score,
        timestamp: Date.now()
    });
}

try {
    highScore = parseInt(localStorage.getItem('fast_orb_high_v1') || '0', 10);
} catch(e) {
    highScore = 0;
}

const planeColors = ['#45f3c0', '#ff007f', '#f3e600', '#ff5500', '#9400d3', '#00f0ff', '#ff0055'];

let levelFlashTimer = 0;
let particles = [];
let shields = [];
let bonuses = [];
let obstacles = [];
let spawnTimer = 0;
let spawnInterval = 100;

let stars = [];
const numStars = 120;

function initStars() {
    stars = [];
    for (let i = 0; i < numStars; i++) {
        stars.push({
            x: (Math.random() - 0.5) * canvas.width * 2,
            y: (Math.random() - 0.5) * canvas.height * 2,
            z: Math.random() * canvas.width,
            size: Math.random() * 1.5 + 0.5,
            color: ['#ffffff', '#66fcf1', '#45f3c0', '#ff007f', '#f3e600'][Math.floor(Math.random() * 5)]
        });
    }
}

let center = { x: 0, y: 0, baseX: 0, baseY: 0, moveAngle: 0 };
let orb = { radius: 100, angle: 0, speed: 0.04, dir: 1, baseSize: 10, dual: false };

window.addEventListener('resize', () => {
    resizeCanvas();
    initStars();
});
resizeCanvas();
initStars();
listenGlobalLeaderboard();

function initGame() {
    score = 0;
    level = 1;
    lives = 1;          
    hasShield = false;
    doubleScoreActive = false;
    doubleScoreTimer = 0;
    
    resizeCanvas();
    initStars();
    orb.angle = 0;
    orb.speed = 0.04;
    orb.dir = 1;
    orb.dual = false;

    center.baseX = canvas.width / 2;
    center.baseY = canvas.height / 2;
    center.x = center.baseX;
    center.y = center.baseY;
    center.moveAngle = 0;

    obstacles = [];
    shields = [];
    bonuses = [];
    particles = [];
    spawnTimer = 0;
    spawnInterval = 90;
    levelFlashTimer = 0;
}

function triggerShake(duration, magnitude) {
    shakeDuration = duration;
    shakeMagnitude = magnitude;
}

function togglePause() {
    if (gameState === 'PLAYING') {
        gameState = 'PAUSED';
        pauseBtn.innerHTML = '▶';
    } else if (gameState === 'PAUSED') {
        gameState = 'PLAYING';
        pauseBtn.innerHTML = '❚❚';
    }
}

function toggleSound() {
    soundEnabled = !soundEnabled;
    soundBtn.innerHTML = soundEnabled ? '🔊' : '🔇';
}

function updateTopBtnsVisibility() {
    if (gameState === 'PLAYING' || gameState === 'PAUSED') {
        pauseBtn.style.display = 'flex';
        soundBtn.style.display = 'flex';
        leaderboardBtn.style.display = 'none';
    } else {
        pauseBtn.style.display = 'none';
        soundBtn.style.display = 'none';
        leaderboardBtn.style.display = 'flex';
    }
}

function triggerAction(e) {
    if (e) e.preventDefault();
    initAudio();

    if (leaderboardModal.style.display === 'flex' || nameInputModal.style.display === 'flex') return;

    if (gameState === 'START' || gameState === 'GAMEOVER') {
        initGame();
        gameState = 'PLAYING';
        pauseBtn.innerHTML = '❚❚';
        playSound(523.25, 'triangle', 0.15);
    } else if (gameState === 'PAUSED') {
        togglePause();
    } else if (gameState === 'PLAYING') {
        orb.dir *= -1;
        playSound(783.99, 'sine', 0.08);
    }
}

pauseBtn.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    initAudio();
    togglePause();
});

soundBtn.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    initAudio();
    toggleSound();
});

leaderboardBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    leaderboardModal.style.display = 'flex';
});

closeLeaderboardBtn.addEventListener('click', () => {
    leaderboardModal.style.display = 'none';
});

submitScoreBtn.addEventListener('click', () => {
    let pName = playerNameInput.value.trim() || 'Gold Hunter';
    pushScoreToFirebase(pName, score);
    nameInputModal.style.display = 'none';
    leaderboardModal.style.display = 'flex';
});

window.addEventListener('keydown', (e) => {
    if (e.code === 'KeyP' || e.code === 'Escape') {
        if (gameState === 'PLAYING' || gameState === 'PAUSED') togglePause();
    } else if (e.code === 'KeyM') {
        toggleSound();
    } else if (e.code === 'Space' || e.code === 'ArrowUp') {
        triggerAction(e);
    }
});

canvas.addEventListener('pointerdown', triggerAction);

function addParticles(x, y, color, count = 20) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 1;
        particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            alpha: 1,
            decay: Math.random() * 0.03 + 0.02,
            color: color,
            size: Math.random() * 3 + 2
        });
    }
}

function spawnObstacle() {
    const gapCenterAngle = Math.random() * Math.PI * 2;
    let baseRedRatio = 1 / 3; 
    let levelBonusRatio = (level - 1) * 0.01; 
    let currentRedRatio = Math.min(0.92, baseRedRatio + levelBonusRatio); 
    
    let redLength = currentRedRatio * Math.PI * 2;
    let gapLength = (Math.PI * 2) - redLength; 

    let isEvenLevel = (level % 2 === 0);
    let startRadius = isEvenLevel ? 15 : canvas.width * 0.48;
    let baseSpeed = 1.5 + Math.min(score * 0.03, 2.5);
    let moveSpeed = isEvenLevel ? baseSpeed : -baseSpeed;

    obstacles.push({
        r: startRadius, 
        speed: moveSpeed,
        gapStart: gapCenterAngle - gapLength / 2,
        gapEnd: gapCenterAngle + gapLength / 2,
        width: 12,
        passed: false,
        isInsideOut: isEvenLevel
    });

    if (!hasShield && Math.random() < 0.22) {
        shields.push({
            r: startRadius,
            angle: gapCenterAngle,
            speed: moveSpeed
        });
    }

    if (Math.random() < 0.18) {
        bonuses.push({
            r: startRadius,
            angle: gapCenterAngle + Math.PI,
            speed: moveSpeed
        });
    }
}

function updateGame() {
    updateTopBtnsVisibility();
    
    let starSpeed = (gameState === 'PLAYING') ? (2 + orb.speed * 20) : 0.5;
    for (let i = 0; i < stars.length; i++) {
        let s = stars[i];
        s.z -= starSpeed;
        if (s.z <= 0) {
            s.z = canvas.width;
            s.x = (Math.random() - 0.5) * canvas.width * 2;
            s.y = (Math.random() - 0.5) * canvas.height * 2;
        }
    }

    if (gameState === 'PAUSED') return;

    if (shakeDuration > 0) shakeDuration--;

    if (doubleScoreActive) {
        doubleScoreTimer--;
        if (doubleScoreTimer <= 0) doubleScoreActive = false;
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy;
        p.alpha -= p.decay;
        if (p.alpha <= 0) particles.splice(i, 1);
    }

    if (levelFlashTimer > 0) levelFlashTimer--;
    if (gameState !== 'PLAYING') return;

    let newLevel = Math.floor(score / 10) + 1;
    if (newLevel > level) {
        level = newLevel;
        lives++; 
        levelFlashTimer = 30;
        playSound(1318.51, 'triangle', 0.2);
        let activeColor = planeColors[(level - 1) % planeColors.length];
        addParticles(center.x, center.y, activeColor, 35);
        triggerShake(10, 4);
    }

    orb.speed = 0.04 + Math.min(score * 0.0003, 0.025);
    orb.angle += orb.speed * orb.dir;

    if (level >= 3) {
        center.moveAngle += 0.015;
        center.x = center.baseX + Math.sin(center.moveAngle) * (canvas.width * 0.06);
        center.y = center.baseY + Math.cos(center.moveAngle * 0.7) * (canvas.height * 0.06);
    }

    orb.dual = level >= 6;

    spawnTimer++;
    if (spawnTimer > spawnInterval) {
        spawnObstacle();
        spawnTimer = 0;
        spawnInterval = Math.max(40, 90 - score * 0.6);
    }

    let currentSize = orb.baseSize * (1 + (level - 1) * 0.06);

    for (let i = shields.length - 1; i >= 0; i--) {
        let s = shields[i];
        s.r += s.speed;

        if (Math.abs(s.r - orb.radius) < 15) {
            let angleDiff = Math.abs((s.angle - orb.angle) % (Math.PI * 2));
            if (angleDiff < 0.3 || angleDiff > Math.PI * 2 - 0.3) {
                hasShield = true;
                playSound(1200, 'sine', 0.15);
                addParticles(center.x + Math.cos(s.angle) * orb.radius, center.y + Math.sin(s.angle) * orb.radius, '#00ffcc', 15);
                shields.splice(i, 1);
                continue;
            }
        }
        if (s.r < 5 || s.r > canvas.width * 0.6) shields.splice(i, 1);
    }

    for (let i = bonuses.length - 1; i >= 0; i--) {
        let b = bonuses[i];
        b.r += b.speed;

        if (Math.abs(b.r - orb.radius) < 15) {
            let angleDiff = Math.abs((b.angle - orb.angle) % (Math.PI * 2));
            if (angleDiff < 0.3 || angleDiff > Math.PI * 2 - 0.3) {
                doubleScoreActive = true;
                doubleScoreTimer = 300; 
                playSound(1500, 'triangle', 0.2);
                addParticles(center.x + Math.cos(b.angle) * orb.radius, center.y + Math.sin(b.angle) * orb.radius, '#ffaa00', 20);
                bonuses.splice(i, 1);
                continue;
            }
        }
        if (b.r < 5 || b.r > canvas.width * 0.6) bonuses.splice(i, 1);
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.r += obs.speed;

        if (Math.abs(obs.r - orb.radius) < (obs.width / 2 + currentSize / 2)) {
            const checkHit = (currentAngle) => {
                let normAngle = (currentAngle % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
                let gStart = (obs.gapStart % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
                let gEnd = (obs.gapEnd % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
                let inGap = gStart < gEnd ? (normAngle >= gStart && normAngle <= gEnd) : (normAngle >= gStart || normAngle <= gEnd);
                return !inGap;
            };

            let hit = checkHit(orb.angle);
            if (!hit && orb.dual) hit = checkHit(orb.angle + Math.PI);

            if (hit) {
                if (hasShield) {
                    hasShield = false;
                    playSound(300, 'sawtooth', 0.2);
                    addParticles(center.x + Math.cos(orb.angle) * orb.radius, center.y + Math.sin(orb.angle) * orb.radius, '#00ffff', 25);
                    triggerShake(12, 5);
                    obstacles.splice(i, 1);
                    continue;
                } else {
                    lives--;
                    playSound(150, 'sawtooth', 0.3);
                    triggerShake(20, 7);
                    let activeColor = planeColors[(level - 1) % planeColors.length];
                    let x = center.x + Math.cos(orb.angle) * orb.radius;
                    let y = center.y + Math.sin(orb.angle) * orb.radius;
                    addParticles(x, y, activeColor, 20);

                    obstacles.splice(i, 1);

                    if (lives <= 0) {
                        gameState = 'GAMEOVER';
                        if (score > highScore) {
                            highScore = score;
                            try { localStorage.setItem('fast_orb_high_v1', highScore); } catch(e) {}
                            setTimeout(() => {
                                nameInputModal.style.display = 'flex';
                            }, 500);
                        }
                    }
                    continue;
                }
            }
        }

        if (!obs.passed) {
            if (!obs.isInsideOut && obs.r < orb.radius - 10) {
                obs.passed = true;
                score += (doubleScoreActive ? 2 : 1);
                playSound(1046.50, 'sine', 0.06);
            } else if (obs.isInsideOut && obs.r > orb.radius + 10) {
                obs.passed = true;
                score += (doubleScoreActive ? 2 : 1);
                playSound(1046.50, 'sine', 0.06);
            }
        }

        if (obs.r < 5 || obs.r > canvas.width * 0.6) obstacles.splice(i, 1);
    }
}

function drawHeartIcon(x, y, size, color) {
    ctx.save();
    ctx.beginPath();
    let topCurveHeight = size * 0.3;
    ctx.moveTo(x, y + topCurveHeight);
    ctx.bezierCurveTo(x, y, x - size / 2, y, x - size / 2, y + topCurveHeight);
    ctx.bezierCurveTo(x - size / 2, y + (size + topCurveHeight) / 2, x, y + (size * 0.9), x, y + size);
    ctx.bezierCurveTo(x, y + (size * 0.9), x + size / 2, y + (size + topCurveHeight) / 2, x + size / 2, y + topCurveHeight);
    ctx.bezierCurveTo(x + size / 2, y, x, y, x, y + topCurveHeight);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.shadowBlur = 8;
    ctx.shadowColor = color;
    ctx.fill();
    ctx.restore();
}

function drawAirplane(angle, currentSize) {
    let x = center.x + Math.cos(angle) * orb.radius;
    let y = center.y + Math.sin(angle) * orb.radius;

    ctx.save();
    ctx.translate(x, y);
    let rotationAngle = angle + (orb.dir > 0 ? Math.PI / 2 : -Math.PI / 2);
    ctx.rotate(rotationAngle);

    let planeColor = planeColors[(level - 1) % planeColors.length];

    ctx.beginPath();
    ctx.moveTo(0, -currentSize * 1.4);
    ctx.lineTo(currentSize * 1.2, currentSize * 0.8);
    ctx.lineTo(0, currentSize * 0.3);
    ctx.lineTo(-currentSize * 1.2, currentSize * 0.8);
    ctx.closePath();

    ctx.fillStyle = planeColor;
    ctx.shadowBlur = 12;
    ctx.shadowColor = planeColor;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(0, -currentSize * 0.4, currentSize * 0.3, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();

    if (hasShield) {
        ctx.beginPath();
        ctx.arc(0, 0, currentSize * 1.8, 0, Math.PI * 2);
        ctx.strokeStyle = '#00ffff';
        ctx.lineWidth = 3;
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#00ffff';
        ctx.stroke();
    }

    ctx.restore();
}

function drawGame() {
    ctx.save();
    
    if (shakeDuration > 0) {
        let offsetX = (Math.random() - 0.5) * shakeMagnitude;
        let offsetY = (Math.random() - 0.5) * shakeMagnitude;
        ctx.translate(offsetX, offsetY);
    }

    ctx.fillStyle = levelFlashTimer > 0 ? '#131b26' : '#07090e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    let cx = canvas.width / 2;
    let cy = canvas.height / 2;
    for (let i = 0; i < stars.length; i++) {
        let s = stars[i];
        let k = 150 / s.z;
        let px = s.x * k + cx;
        let py = s.y * k + cy;

        if (px >= 0 && px <= canvas.width && py >= 0 && py <= canvas.height) {
            let pSize = Math.max(0.1, (1 - s.z / canvas.width) * s.size * 2);
            ctx.beginPath();
            ctx.arc(px, py, pSize, 0, Math.PI * 2);
            ctx.fillStyle = s.color;
            ctx.shadowBlur = 6;
            ctx.shadowColor = s.color;
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    }

    if (center.x && center.y) {
        ctx.beginPath();
        ctx.arc(center.x, center.y, 10, 0, Math.PI * 2);
        ctx.fillStyle = '#66fcf1';
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#66fcf1';
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.beginPath();
        ctx.arc(center.x, center.y, orb.radius, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(102, 252, 241, 0.25)';
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    obstacles.forEach(obs => {
        ctx.beginPath();
        ctx.arc(center.x, center.y, obs.r, obs.gapEnd, obs.gapStart + Math.PI * 2);
        ctx.strokeStyle = '#ff0033';
        ctx.lineWidth = obs.width + 1;
        ctx.stroke();
    });

    shields.forEach(s => {
        let sx = center.x + Math.cos(s.angle) * s.r;
        let sy = center.y + Math.sin(s.angle) * s.r;
        ctx.beginPath();
        ctx.arc(sx, sy, 8, 0, Math.PI * 2);
        ctx.fillStyle = '#00ffff';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#00ffff';
        ctx.fill();
        ctx.shadowBlur = 0;
    });

    bonuses.forEach(b => {
        let bx = center.x + Math.cos(b.angle) * b.r;
        let by = center.y + Math.sin(b.angle) * b.r;
        ctx.beginPath();
        ctx.arc(bx, by, 8, 0, Math.PI * 2);
        ctx.fillStyle = '#ffaa00';
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#ffaa00';
        ctx.fill();
        ctx.shadowBlur = 0;
    });

    particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.fill();
        ctx.globalAlpha = 1.0;
    });

    let currentSize = orb.baseSize * (1 + (level - 1) * 0.06);

    if (gameState === 'PLAYING' || gameState === 'START' || gameState === 'PAUSED') {
        drawAirplane(orb.angle, currentSize);
        if (orb.dual) drawAirplane(orb.angle + Math.PI, currentSize);
    }

    ctx.fillStyle = '#ffffff';

    if (gameState === 'START') {
        ctx.textAlign = 'center';
        ctx.font = 'bold 22px Arial';
        ctx.fillText('FAST ORB', canvas.width / 2, canvas.height / 2 - 40);
        ctx.font = '14px Arial';
        ctx.fillStyle = '#a0a5b0';
        ctx.fillText('Tap to start playing', canvas.width / 2, canvas.height / 2 + 10);
        ctx.fillText('Level up to gain lives, dodge red rings!', canvas.width / 2, canvas.height / 2 + 35);
    } else if (gameState === 'PLAYING' || gameState === 'PAUSED') {
        ctx.textAlign = 'center';
        ctx.font = 'bold 36px Arial';
        ctx.fillText(score, canvas.width / 2, 50);

        ctx.textAlign = 'left';
        ctx.font = 'bold 16px Arial';
        ctx.fillStyle = '#66fcf1';
        ctx.fillText('LVL ' + level, 15, 30);

        let statusY = canvas.height - 20;
        ctx.fillStyle = '#ff0055';
        drawHeartIcon(20, statusY - 6, 18, '#ff0055');
        ctx.font = 'bold 16px Arial';
        ctx.fillText('x ' + lives, 40, statusY);
        statusY -= 25;

        if (hasShield) {
            ctx.fillStyle = '#00ffff';
            ctx.fillText('🛡️ SHIELD', 15, statusY);
            statusY -= 22;
        }
        if (doubleScoreActive) {
            ctx.fillStyle = '#ffaa00';
            ctx.fillText('⚡ 2X (' + Math.ceil(doubleScoreTimer / 60) + 's)', 15, statusY);
        }

        if (levelFlashTimer > 10 && gameState === 'PLAYING') {
            ctx.textAlign = 'center';
            ctx.font = 'bold 18px Arial';
            ctx.fillStyle = '#f3e600';
            ctx.fillText('LEVEL UP TO LEVEL ' + level + ' (+1 LIFE)!', canvas.width / 2, canvas.height / 2 - 60);
            ctx.font = '13px Arial';
            ctx.fillStyle = '#00ffff';
            ctx.fillText(level % 2 === 0 ? '▶ Expanding from inside out!' : '◀ Shrinking from outside in!', canvas.width / 2, canvas.height / 2 - 35);
        }

        if (gameState === 'PAUSED') {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.textAlign = 'center';
            ctx.font = 'bold 32px Arial';
            ctx.fillStyle = '#66fcf1';
            ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2 - 10);
            ctx.font = '15px Arial';
            ctx.fillStyle = '#ffffff';
            ctx.fillText('Tap to resume', canvas.width / 2, canvas.height / 2 + 30);
        }
    } else if (gameState === 'GAMEOVER') {
        ctx.textAlign = 'center';
        ctx.font = 'bold 30px Arial';
        ctx.fillStyle = '#ff0055';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 50);
        
        ctx.font = '16px Arial';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('Final Score: ' + score, canvas.width / 2, canvas.height / 2 - 5);
        ctx.fillText('Level Reached: Level ' + level, canvas.width / 2, canvas.height / 2 + 25);
        
        if (score >= highScore && score > 0) {
            ctx.fillStyle = '#f3e600';
            ctx.font = 'bold 16px Arial';
            ctx.fillText('🏆 NEW HIGH SCORE!', canvas.width / 2, canvas.height / 2 + 55);
        } else {
            ctx.fillStyle = '#a0a5b0';
            ctx.font = '16px Arial';
            ctx.fillText('High Score: ' + highScore, canvas.width / 2, canvas.height / 2 + 55);
        }
        
        ctx.font = '15px Arial';
        ctx.fillStyle = '#66fcf1';
        ctx.fillText('Tap screen to play again', canvas.width / 2, canvas.height / 2 + 95);
    }

    ctx.restore();
}

center.baseX = canvas.width / 2;
center.baseY = canvas.height / 2;
center.x = center.baseX;
center.y = center.baseY;

function mainLoop() {
    updateGame();
    drawGame();
    requestAnimationFrame(mainLoop);
}

mainLoop();
</script>
</body>
</html>
